<head>
<meta charset="UTF-8">

<title>SIPAKATA — Sistem Pengelolaan Arsip Kesehatan Terpadu</title>

<!-- Tanpa build tool: cukup klik 2x file ini -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: {
        sans: ['Figtree', 'system-ui', 'sans-serif'],
        display: ['"Bricolage Grotesque"', 'Figtree', 'sans-serif'],
      },
      colors: {
        ink:   { DEFAULT: 'rgb(var(--ink) / <alpha-value>)', soft: 'rgb(var(--ink-soft) / <alpha-value>)' },
        tint:  { 50: 'rgb(var(--tint-50) / <alpha-value>)', 100: 'rgb(var(--tint-100) / <alpha-value>)', 200: 'rgb(var(--tint-200) / <alpha-value>)' },
        paper: 'rgb(var(--paper) / <alpha-value>)',
        stamp: 'rgb(var(--stamp) / <alpha-value>)',
      }
    } }
  }
</script>

<style>
  /* ===== Tema: 4 aksen x terang/gelap ===== */
  :root { --ink:15 61 58; --ink-soft:29 85 80; --tint-50:240 247 245; --tint-100:213 232 228; --tint-200:176 214 207; --paper:246 247 244; --stamp:200 55 45; }
  html[data-accent="ocean"] { --ink:30 64 175; --ink-soft:29 78 216; --tint-50:239 246 255; --tint-100:219 234 254; --tint-200:191 219 254; }
  html[data-accent="plum"]  { --ink:91 33 182; --ink-soft:109 40 217; --tint-50:245 243 255; --tint-100:237 233 254; --tint-200:221 214 254; }
  html[data-accent="ember"] { --ink:154 52 18; --ink-soft:194 65 12; --tint-50:255 247 237; --tint-100:255 237 213; --tint-200:254 215 170; }
  html.dark { color-scheme: dark; --paper:13 19 18; --stamp:229 72 60; }
  html.dark[data-accent="forest"] { --ink:38 138 126; --ink-soft:52 160 146; --tint-50:20 46 43; --tint-100:26 62 58; --tint-200:36 84 78; }
  html.dark[data-accent="ocean"]  { --ink:70 115 235; --ink-soft:96 140 245; --tint-50:22 32 58; --tint-100:28 42 78; --tint-200:40 58 108; }
  html.dark[data-accent="plum"]   { --ink:124 77 236; --ink-soft:148 100 246; --tint-50:36 26 58; --tint-100:46 34 78; --tint-200:62 46 108; }
  html.dark[data-accent="ember"]  { --ink:217 79 10; --ink-soft:234 100 30; --tint-50:52 30 18; --tint-100:68 38 20; --tint-200:92 52 28; }

  body { font-family:'Figtree',system-ui,sans-serif; background:rgb(var(--paper)); color:#1c2b29; transition:background .25s,color .25s; }
  .font-display { font-family:'Bricolage Grotesque','Figtree',sans-serif; }

  /* ===== Mode gelap: timpa kelas netral yang dipakai di seluruh aplikasi ===== */
  html.dark body { color:#e3ebe9; }
  html.dark .bg-white { background-color:#172120; }
  html.dark .hover\:bg-white:hover { background-color:#1e2b29; }
  html.dark .bg-stone-50 { background-color:#1a2523; }
  html.dark .bg-stone-50\/60 { background-color:rgba(26,37,35,.6); }
  html.dark .bg-stone-100 { background-color:#212e2b; }
  html.dark .hover\:bg-stone-100:hover { background-color:#283734; }
  html.dark .bg-stone-200 { background-color:#2b3a37; }
  html.dark .hover\:bg-stone-200:hover { background-color:#33443f; }
  html.dark .hover\:bg-stone-50:hover { background-color:#1f2c2a; }
  html.dark .bg-stone-900 { background-color:#0b1110; }
  html.dark .border-stone-100 { border-color:#22302d; }
  html.dark .border-stone-200 { border-color:#2a3a36; }
  html.dark .border-stone-300 { border-color:#3a4c48; }
  html.dark .hover\:border-stone-300:hover { border-color:#4a5e59; }
  html.dark .text-slate-400 { color:#7d908b; }
  html.dark .text-slate-500 { color:#97a9a4; }
  html.dark .text-slate-600 { color:#b0bfbb; }
  html.dark .text-slate-700 { color:#ccd8d5; }
  html.dark .bg-amber-50  { background-color:rgba(245,158,11,.12); }
  html.dark .bg-amber-100 { background-color:rgba(245,158,11,.18); }
  html.dark .text-amber-700 { color:#fbbf24; }
  html.dark .text-amber-800 { color:#fcd34d; }
  html.dark .bg-emerald-100 { background-color:rgba(16,185,129,.18); }
  html.dark .text-emerald-700 { color:#34d399; }
  html.dark .text-emerald-800 { color:#6ee7b7; }
  html.dark .bg-red-50  { background-color:rgba(239,68,68,.14); }
  html.dark .bg-red-100 { background-color:rgba(239,68,68,.2); }
  html.dark .hover\:bg-red-100:hover { background-color:rgba(239,68,68,.26); }
  html.dark .text-red-800 { color:#fca5a5; }
  html.dark .bg-white\/70 { background-color:rgba(23,33,32,.7); }
  html.dark .hover\:bg-slate-100:hover { background-color:#283734; }
  html.dark .hover\:bg-red-50:hover { background-color:rgba(239,68,68,.14); }
  html.dark .text-amber-600 { color:#f59e0b; }
  html.dark .logo-img { background:#fff; border-radius:.5rem; padding:3px 5px; }
  html.dark input, html.dark select, html.dark textarea { background-color:#1a2523; color:#e3ebe9; }
  html.dark ::placeholder { color:#6b7e79; }

  /* ===== Animasi ===== */
  .pop { animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  .fade-in { animation:fade .18s ease-out; }
  .rise { animation:rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop  { from { opacity:0; transform:scale(.94) translateY(6px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .stamp { animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes stamp { from { opacity:0; transform:rotate(-9deg) scale(1.7); } to { opacity:1; transform:rotate(-3deg) scale(1); } }
  /* pakai properti "translate" supaya tidak menimpa rotasi Tailwind */
  .float-a { animation:floaty 6s ease-in-out infinite; }
  .float-b { animation:floaty 7.5s ease-in-out -2s infinite; }
  .float-c { animation:floaty 5.5s ease-in-out -1s infinite; }
  @keyframes floaty { 50% { translate:0 -12px; } }
  .confetti { position:absolute; top:-16px; width:8px; height:14px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(108vh) rotate(720deg); opacity:.85; } }

  .dz-active { border-color:rgb(var(--ink)) !important; background:rgb(var(--tint-100)) !important; transform:scale(1.01); }
  .drop-hi   { background:rgb(var(--tint-100)) !important; outline:2px dashed rgb(var(--ink)); outline-offset:-2px; }
  .scroll-thin::-webkit-scrollbar { width:8px; height:8px }
  .scroll-thin::-webkit-scrollbar-thumb { background:#9fb0ab66; border-radius:8px }

  /* ===== Tata letak dashboard ===== */
  @media (min-width:1024px) {
    #main { grid-template-columns:16rem minmax(20rem,27rem) 1fr; }
    #main[data-side="0"] { grid-template-columns:minmax(20rem,27rem) 1fr; }
    #main[data-list="0"] { grid-template-columns:16rem 1fr; }
    #main[data-side="0"][data-list="0"] { grid-template-columns:1fr; }
    #main[data-side="0"] [data-panel="side"], #main[data-list="0"] [data-panel="list"] { display:none; }
  }
  @media (max-width:1023px) {   /* HP: satu panel sekali tampil, pindah lewat tab bawah */
    #main [data-panel] { display:none; }
    #main[data-tab="side"] [data-panel="side"] { display:block; }
    #main[data-tab="list"] [data-panel="list"], #main[data-tab="preview"] [data-panel="preview"] { display:flex; }
  }
  @media (prefers-reduced-motion: reduce) { *{ animation:none !important; transition:none !important; } }
</style>
</head>

function applyTheme(save = true) {
  document.documentElement.classList.toggle('dark', THEME.mode === 'dark');
  document.documentElement.dataset.accent = THEME.accent;
  if (save) { try { localStorage.setItem('arsip-theme', JSON.stringify(THEME)); } catch {} }
}
(function loadTheme() {
  try { const t = JSON.parse(localStorage.getItem('arsip-theme') || 'null'); if (t && ACCENTS[t.accent]) { THEME.mode = t.mode; THEME.accent = t.accent; applyTheme(false); return; } } catch {}
  THEME.mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(false);
})();
function openThemeModal() {

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const root = document.createElement('div');
  root.className = 'fixed inset-0 pointer-events-none z-[55] overflow-hidden';
  const cols = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#a855f7', '#14b8a6'];
  for (let i = 0; i < 54; i++) {
    const sp = document.createElement('span'); sp.className = 'confetti';
    sp.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-delay:${Math.random() * .5}s;animation-duration:${1.7 + Math.random() * 1.5}s;transform:rotate(${Math.random() * 360}deg)`;
    root.appendChild(sp);
  }
  document.body.appendChild(root); setTimeout(() => root.remove(), 4000);
}

function genCode() { // ARS-XXXX-XXXX (tanpa karakter membingungkan 0/O/1/I)
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint8Array(8));
  const s = [...r].map(x => abc[x % abc.length]).join('');
  return `ARS-${s.slice(0,4)}-${s.slice(4)}`;
}

function toast(msg, type = 'ok') {
  const colors = { ok:'bg-ink text-white', error:'bg-stamp text-white', info:'bg-slate-800 text-white' };
  const el = document.createElement('div');
  el.className = `pop flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium ${colors[type]}`;
  el.innerHTML = `${ic(type === 'error' ? 'alert-circle' : 'check-circle-2', 'w-4 h-4 shrink-0')}<span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(el); icons();
  setTimeout(() => el.remove(), 3800);
}

function validateFile(f) {
  if (!ALLOWED[f.type]) return 'Format tidak didukung. Gunakan PDF, gambar, Word, atau Excel.';
  if (f.size > CFG.MAX_UPLOAD_MB * 1048576) return `Ukuran file melebihi ${CFG.MAX_UPLOAD_MB} MB.`;
  if (f.size === 0) return 'File kosong.';
  return null;
}

function addFiles(list) {
  const incoming = [...list]; if (!incoming.length) return;
  let skipped = 0;
  for (const f of incoming) {
    const err = validateFile(f);
    if (err) { toast(`${f.name}: ${err}`, 'error'); continue; }
    if (P.files.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) continue;   // sudah dipilih
    if (P.files.length >= MAX_FILES) { skipped++; continue; }
    P.files.push(f);
    P.urls.push(f.type.startsWith('image/') ? URL.createObjectURL(f) : null);
  }
  if (skipped) toast(`Maksimal ${MAX_FILES} file sekali kirim. ${skipped} file tidak ditambahkan.`, 'error');
  renderFiles();
}
function renderFiles() {
  const box = $('#file-prev'); if (!box) return;
  if (!P.files.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const total = P.files.reduce((s, f) => s + f.size, 0);
  box.classList.remove('hidden');
  box.innerHTML = `
    <div class="flex items-center justify-between text-xs font-semibold text-slate-500 mb-2">
      <span>${P.files.length} file dipilih · ${fmtSize(total)}</span>
      <button data-act="clear-file" class="text-stamp hover:underline">Hapus semua</button>
    </div>
    <div class="space-y-2">${P.files.map((f, i) => `
    <div class="flex items-center gap-3 p-3 rounded-xl border border-tint-200 bg-tint-50/60">
      <div class="w-12 h-12 rounded-lg overflow-hidden bg-white border border-stone-200 grid place-items-center shrink-0 text-ink">
        ${P.urls[i] ? `<img src="${P.urls[i]}" class="w-full h-full object-cover" alt="">` : ic(iconFor(f.type), 'w-6 h-6')}
      </div>
      <div class="min-w-0 flex-1">
        <p class="font-semibold text-sm truncate">${esc(f.name)}</p>
        <p class="text-xs text-slate-500">${ALLOWED[f.type]} · ${fmtSize(f.size)}</p>
      </div>
      <button data-act="remove-file" data-id="${i}" class="p-2 rounded-lg text-slate-500 hover:bg-white hover:text-stamp" title="Hapus dari daftar">${ic('x')}</button>
    </div>`).join('')}</div>`;
  icons();
}
function removeFile(i) {
  if (P.urls[i]) URL.revokeObjectURL(P.urls[i]);
  P.files.splice(i, 1); P.urls.splice(i, 1);
  renderFiles();
}
function clearFiles() {
  P.urls.forEach(u => u && URL.revokeObjectURL(u));
  P.files = []; P.urls = [];
  renderFiles();
  const inp = $('#file-input'); if (inp) inp.value = '';
}

// Upload dengan XMLHttpRequest agar progress bar benar-benar akurat
function xhrUpload(bucket, path, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    const url = `${CFG.SUPABASE_URL}/storage/v1/object/${bucket}/${path.split('/').map(encodeURIComponent).join('/')}`;
    x.open('POST', url);
    x.setRequestHeader('apikey', CFG.SUPABASE_ANON_KEY);
    if (CFG.SUPABASE_ANON_KEY.startsWith('eyJ')) x.setRequestHeader('Authorization', 'Bearer ' + CFG.SUPABASE_ANON_KEY); // key baru (sb_publishable_) cukup lewat header apikey
    x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.setRequestHeader('x-upsert', 'false');
    x.upload.onprogress = e => e.lengthComputable && onProgress(Math.round(e.loaded / e.total * 100));
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return resolve();
      let m = 'Upload gagal'; try { const j = JSON.parse(x.responseText); m = j.message || j.error || m; } catch {}
      reject(new Error(m));
    };
    x.onerror = () => reject(new Error('Koneksi terputus saat mengunggah'));
    x.send(file);
  });
}

async function uploadOne(f, code, onProgress) {
  const d = new Date();
  const path = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${code}-${safeName(f.name)}`;
  try {
    await xhrUpload('inbox-temp', path, f, onProgress);                // 1) file -> Storage (progress asli)
  } catch (xhrErr) {
    console.warn('XHR upload gagal, mencoba SDK:', xhrErr.message);
    onProgress(30);
    const up = await sb.storage.from('inbox-temp').upload(path, f, { contentType: f.type, upsert: false });
    if (up.error) throw new Error(`${up.error.message}${up.error.statusCode ? ' (' + up.error.statusCode + ')' : ''}`);
    onProgress(100);
  }
  return path;
}

async function submitUpload() {
  if (P.busy) return;
  const sender = $('#f-sender').value.trim();
  const institution = $('#f-institution').value.trim();
  const title = $('#f-title').value.trim();
  const note = $('#f-note').value.trim();
  if (!P.files.length) return toast('Pilih minimal satu file terlebih dahulu.', 'error');
  if (!sender) { $('#f-sender').focus(); return toast('Nama pengirim wajib diisi.', 'error'); }
  if (!institution) { $('#f-institution').focus(); return toast('Nama instansi pengirim wajib diisi.', 'error'); }
  if (!title) { $('#f-title').focus(); return toast('Judul dokumen wajib diisi.', 'error'); }
  if (!note) { $('#f-note').focus(); return toast('Catatan singkat wajib diisi.', 'error'); }

  const files = [...P.files], n = files.length;
  const done = [], failed = [];

  P.busy = true;
  const btn = $('#btn-submit'); btn.disabled = true; icons();
  $('#prog').classList.remove('hidden');
  const setP = (i, p) => {
    const pct = Math.round((i + p / 100) / n * 100);
    $('#prog-bar').style.width = pct + '%'; $('#prog-pct').textContent = pct + '%';
  };

  for (let i = 0; i < n; i++) {
    const f = files[i], code = genCode();
    btn.innerHTML = `${ic('loader-2', 'w-4 h-4 animate-spin')} Mengunggah ${i + 1} / ${n}…`; icons();
    $('#prog-label').textContent = `Mengunggah ${i + 1} dari ${n}: ${f.name}`;
    try {
      const path = await uploadOne(f, code, p => setP(i, p));
      const { error } = await sb.from('documents').insert({          // 2) metadata -> tabel (tanpa .select(): anon tidak boleh SELECT)
        title: n > 1 ? `${title} (${i + 1}/${n})`.slice(0, 200) : title,
        sender_name: sender, sender_institution: institution,
        category: $('#f-cat').value,
        description: note,
        file_name: f.name, file_path: path, file_url: `inbox-temp/${path}`,
        bucket: 'inbox-temp', mime_type: f.type, file_size: f.size,
        tracking_code: code,                                         // status otomatis 'pending'
      });
      if (error) throw error;
      done.push({ code, name: f.name });
      histAdd([{ code, name: f.name, title: n > 1 ? `${title} (${i + 1}/${n})` : title, at: new Date().toISOString() }]);
    } catch (err) {
      console.error('Upload/insert gagal:', err);
      const msg = [err.message, err.code && `[${err.code}]`, err.details, err.hint].filter(Boolean).join(' · ') || 'Gagal mengirim berkas';
      failed.push({ file: f, msg });
    }
    setP(i + 1, 0);
  }

  P.busy = false;
  P.codes = done;
  // yang berhasil dikeluarkan dari daftar, yang gagal tetap ada untuk dicoba lagi
  const sent = new Set(files.filter(f => !failed.some(x => x.file === f)));
  P.urls.forEach((u, i) => { if (u && sent.has(P.files[i])) URL.revokeObjectURL(u); });
  P.urls  = P.urls.filter((u, i) => !sent.has(P.files[i]));
  P.files = P.files.filter(f => !sent.has(f));
  renderFiles(); resetSubmitUi();

  if (!done.length) return toast(failed[0].msg + (n > 1 ? ` (${failed.length} file gagal)` : ''), 'error');
  histRender();
  showSuccess(done, failed);
}

const docById = id => A.docs.find(d => d.id === id) || A.trash.find(d => d.id === id);
const daysLeft = d => Math.max(0, Math.ceil((new Date(d.deleted_at).getTime() + TRASH_DAYS * 86400000 - Date.now()) / 86400000));
const folderById = id => A.folders.find(f => f.id === id);

function descendants(id) {
  const out = [id];
  A.folders.filter(f => f.parent_id === id).forEach(c => out.push(...descendants(c.id)));
  return out;
}
function folderPath(id) {
  const parts = []; let f = folderById(id);
  while (f) { parts.unshift(f.name); f = f.parent_id ? folderById(f.parent_id) : null; }
  return parts.join(' / ');
}

async function loadAll(silent = false) {
  const [f, d] = await Promise.all([
    sb.from('folders').select('*').order('name'),
    sb.from('documents').select('*').order('created_at', { ascending: false }),
  ]);
  if (f.error || d.error) return toast((f.error || d.error).message, 'error');
  A.folders = f.data;
  A.docs  = d.data.filter(x => !x.deleted_at);
  A.trash = d.data.filter(x => x.deleted_at).sort((a, b) => new Date(b.deleted_at) - new Date(a.deleted_at));
  if (A.sel && !docById(A.sel)) A.sel = null;
  renderAll();
  purgeExpired().then(n => { if (n) { renderAll(); toast(`${n} berkas di Sampah lebih dari ${TRASH_DAYS} hari dan dihapus permanen`, 'info'); } }).catch(e => console.warn('Auto-hapus sampah gagal:', e.message));
  if (!silent && A.view === 'inbox' && !A.sel) { const first = A.docs.find(x => x.status === 'pending'); if (first && !isMobile()) selectDoc(first.id); }
}

/* ---------- filter ---------- */
function visibleDocs() {
  let l = A.docs;
  const v = A.view;
  if (v === 'trash') l = A.trash;
  else if (v === 'inbox') l = l.filter(d => d.status === 'pending');
  else if (v === 'all') l = l.filter(d => d.status === 'archived');
  else if (v === 'unfiled') l = l.filter(d => d.status === 'archived' && !d.folder_id);
  else if (v === 'rejected') l = l.filter(d => d.status === 'rejected');
  else { const ids = descendants(v); l = l.filter(d => d.status === 'archived' && ids.includes(d.folder_id)); }

  const q = A.search.trim().toLowerCase();
  if (q) l = l.filter(d => [d.title, d.sender_name, d.sender_institution, d.tracking_code, d.file_name, d.category].some(x => (x || '').toLowerCase().includes(q)));
  if (A.from) { const t = new Date(A.from + 'T00:00:00'); l = l.filter(d => new Date(d.created_at) >= t); }
  if (A.to)   { const t = new Date(A.to + 'T23:59:59');   l = l.filter(d => new Date(d.created_at) <= t); }
  return l;
}

function animateCounts() {
  document.querySelectorAll('#stats [data-count]').forEach(el => {
    const to = +el.dataset.count, from = +el.dataset.from;
    if (from === to) return;
    const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 650); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function renderStats() {
  const archived = A.docs.filter(d => d.status === 'archived').length;
  const pending  = A.docs.filter(d => d.status === 'pending').length;
  const used = [...A.docs, ...A.trash].reduce((s, d) => s + (d.file_size || 0), 0);
  const pct = Math.min(100, used / (CFG.QUOTA_MB * 1048576) * 100);
  const prev = A.statPrev;
  const num = (v, from) => `<span data-count="${v}" data-from="${from}">${from}</span>`;
  const card = (icon, label, val, extra = '', tone = 'bg-tint-100 text-ink') => `
    <div class="min-w-[15rem] snap-start sm:min-w-0 bg-white rounded-2xl border border-stone-200 p-4 flex items-center gap-4 hover:shadow-md hover:-translate-y-0.5 transition">
      <div class="w-12 h-12 rounded-xl grid place-items-center shrink-0 ${tone}">${ic(icon, 'w-6 h-6')}</div>
      <div class="min-w-0 flex-1"><p class="text-sm text-slate-500">${label}</p><p class="font-display font-extrabold text-2xl leading-tight">${val}</p>${extra}</div>
    </div>`;
  $('#stats').innerHTML =
    card('folder-check', 'Total arsip', num(archived, prev.archived), '<p class="text-xs text-slate-400">Berkas tersimpan</p>') +
    card('inbox', 'Berkas terkirim', num(pending, prev.pending), pending ? `<p class="text-xs text-amber-700 font-semibold flex items-center gap-1.5"><span class="relative flex w-2 h-2"><span class="animate-ping absolute inline-flex w-full h-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex w-2 h-2 rounded-full bg-amber-500"></span></span>Perlu disortir</p>` : `<p class="text-xs text-slate-400">Inbox bersih</p>`, 'bg-amber-50 text-amber-700') +
    card('hard-drive', 'Kapasitas storage', `${fmtSize(used)}`, `
      <div class="h-1.5 rounded-full bg-stone-200 mt-1.5 overflow-hidden"><div class="h-full rounded-full transition-all duration-700 ${pct > 85 ? 'bg-stamp' : 'bg-ink'}" style="width:${pct}%"></div></div>
      <p class="text-xs text-slate-400 mt-1">${pct.toFixed(1)}% dari ${CFG.QUOTA_MB >= 1024 ? (CFG.QUOTA_MB / 1024) + ' GB' : CFG.QUOTA_MB + ' MB'}</p>`, 'bg-stone-100 text-slate-700');
  A.statPrev = { archived, pending };
  icons(); animateCounts();
}

function navItem(id, icon, label, count) {
  const on = A.view === id;
  return `<div data-act="view" data-id="${id}" class="flex items-center gap-2 px-2.5 py-2 rounded-lg cursor-pointer text-sm font-semibold ${on ? 'bg-ink text-white' : 'text-slate-700 hover:bg-stone-100'}">
    ${ic(icon, 'w-4 h-4 shrink-0')}<span class="flex-1 truncate">${label}</span>
    ${count ? `<span class="text-xs px-1.5 rounded-full ${on ? 'bg-white/20' : id === 'inbox' ? 'bg-amber-100 text-amber-800' : 'bg-stone-200 text-slate-600'}">${count}</span>` : ''}</div>`;
}

function treeHtml(parent = null, depth = 0) {
  return A.folders.filter(f => (f.parent_id || null) === parent).map(f => {
    const kids = A.folders.some(k => k.parent_id === f.id);
    const open = A.expanded.has(f.id);
    const on = A.view === f.id;
    const count = A.docs.filter(d => d.status === 'archived' && d.folder_id === f.id).length;
    return `<div>
      <div data-drop="${f.id}" data-act="view" data-id="${f.id}" style="padding-left:${6 + depth * 14}px"
           class="group flex items-center gap-1 pr-1.5 py-1.5 rounded-lg cursor-pointer text-sm ${on ? 'bg-ink text-white font-semibold' : 'text-slate-700 hover:bg-stone-100'}">
        ${kids ? `<button data-act="toggle" data-id="${f.id}" class="p-0.5 rounded hover:bg-black/10">${ic(open ? 'chevron-down' : 'chevron-right', 'w-3.5 h-3.5')}</button>` : `<span class="w-5"></span>`}
        ${ic(on || open ? 'folder-open' : 'folder', 'w-4 h-4 shrink-0 ' + (on ? '' : 'text-amber-600'))}
        <span class="flex-1 truncate">${esc(f.name)}</span>
        ${count ? `<span class="text-xs opacity-70">${count}</span>` : ''}
        <span class="hidden group-hover:flex items-center">
          <button data-act="rename-folder" data-id="${f.id}" class="p-1 rounded hover:bg-black/10" title="Ubah nama folder">${ic('pencil', 'w-3.5 h-3.5')}</button>
          <button data-act="new-folder" data-id="${f.id}" class="p-1 rounded hover:bg-black/10" title="Sub-folder baru">${ic('folder-plus', 'w-3.5 h-3.5')}</button>
          <button data-act="del-folder" data-id="${f.id}" class="p-1 rounded hover:bg-black/10" title="Hapus folder">${ic('trash-2', 'w-3.5 h-3.5')}</button>
        </span>
      </div>
      ${kids && open ? treeHtml(f.id, depth + 1) : ''}</div>`;
  }).join('');
}

function renderSide() {
  const pending  = A.docs.filter(d => d.status === 'pending').length;
  const archived = A.docs.filter(d => d.status === 'archived').length;
  const unfiled  = A.docs.filter(d => d.status === 'archived' && !d.folder_id).length;
  const rejected = A.docs.filter(d => d.status === 'rejected').length;
  $('#side').innerHTML = `
    <div class="space-y-0.5">
      ${navItem('inbox', 'inbox', 'Inbox', pending)}
      ${navItem('all', 'library', 'Semua arsip', archived)}
      ${navItem('unfiled', 'folder-minus', 'Tanpa folder', unfiled)}
      ${navItem('rejected', 'ban', 'Ditolak', rejected)}
      ${navItem('trash', 'trash-2', 'Sampah', A.trash.length)}
    </div>
    <div class="flex items-center justify-between mt-5 mb-1 px-2.5">
      <span class="text-sm font-bold text-slate-500">Folder</span>
      <button data-act="new-folder" class="inline-flex items-center gap-1 text-xs font-semibold text-ink hover:bg-tint-50 px-2 py-1 rounded-lg">${ic('plus', 'w-3.5 h-3.5')} Baru</button>
    </div>
    <div class="space-y-0.5">${A.folders.length ? treeHtml() : `<p class="text-xs text-slate-400 px-2.5 py-2">Belum ada folder. Buat folder pertama untuk mulai merapikan arsip.</p>`}</div>
    <p class="text-[11px] text-slate-400 px-2.5 mt-4 leading-snug">Tips: tarik berkas dari daftar dan lepas di atas folder untuk mengarsipkannya.</p>`;

}

function actions(d, big = false) {
  const b = (act, icon, label, cls) => `<button data-act="${act}" data-id="${d.id}" title="${label}" class="inline-flex items-center gap-1 ${big ? 'px-3 py-2 text-sm' : 'px-2 py-1 text-xs'} rounded-lg font-semibold ${cls}">${ic(icon, big ? 'w-4 h-4' : 'w-3.5 h-3.5')}${big ? label : ''}</button>`;
  const prev = big ? '' : b('preview', 'eye', 'Preview', 'bg-stone-100 text-slate-700 hover:bg-stone-200');
  const edit = b('edit', 'pencil', 'Edit', 'bg-stone-100 text-slate-700 hover:bg-stone-200');
  if (d.deleted_at)            return prev + b('untrash', 'undo-2', 'Pulihkan', 'bg-tint-50 text-ink hover:bg-tint-100') + b('purge', 'trash-2', 'Hapus permanen', 'bg-red-50 text-stamp hover:bg-red-100');
  if (d.status === 'pending')  return prev + b('approve', 'check-check', 'Setujui & Arsipkan', 'bg-ink text-white hover:bg-ink-soft') + edit + b('reject', 'x', 'Tolak', 'bg-red-50 text-stamp hover:bg-red-100');
  if (d.status === 'archived') return prev + b('move', 'folder-input', 'Pindahkan', 'bg-tint-50 text-ink hover:bg-tint-100') + edit + b('delete', 'trash-2', 'Hapus', 'bg-red-50 text-stamp hover:bg-red-100');
  return prev + b('restore', 'undo-2', 'Kembalikan ke Inbox', 'bg-tint-50 text-ink hover:bg-tint-100') + edit + b('delete', 'trash-2', 'Hapus', 'bg-red-50 text-stamp hover:bg-red-100');
}

function viewTitle() {
  return { inbox:'Inbox', all:'Semua arsip', unfiled:'Arsip tanpa folder', rejected:'Berkas ditolak', trash:'Sampah' }[A.view]
    || `<span class="inline-flex items-center gap-1.5">${ic('folder-open', 'w-4 h-4 text-amber-600')}${esc(folderPath(A.view))}</span>`;
}

async function ensureThumbs(list) {
  const need = list.filter(d => (d.mime_type || '').startsWith('image/') && A.thumbs[d.id] === undefined).slice(0, 60);
  if (!need.length) return;
  need.forEach(d => { A.thumbs[d.id] = ''; });            // tandai sedang diproses
  const byBucket = {}; need.forEach(d => (byBucket[d.bucket] ||= []).push(d));
  let changed = false;
  await Promise.all(Object.entries(byBucket).map(async ([b, ds]) => {
    const { data, error } = await sb.storage.from(b).createSignedUrls(ds.map(d => d.file_path), 3600);
    if (error || !data) return;
    data.forEach((r, i) => { if (r.signedUrl) { A.thumbs[ds[i].id] = r.signedUrl; changed = true; } });
  }));
  if (changed) renderList();
}

function renderList() {
  const l = visibleDocs();
  const grid = A.mode === 'grid';
  const cls = d => A.sel === d.id ? 'border-ink bg-tint-50/70 ring-1 ring-ink' : 'border-stone-200 bg-white hover:border-stone-300 hover:shadow-sm';
  const trashLine = d => `<p class="text-xs text-stamp mt-0.5">${ic('trash-2', 'w-3 h-3 inline -mt-0.5')} Dihapus ${fmtDate(d.deleted_at)} · hilang permanen dalam ${daysLeft(d)} hari</p>`;
  const folderLine = d => d.deleted_at ? trashLine(d) : d.status === 'archived' && d.folder_id ? `<p class="text-xs text-amber-700 mt-0.5 truncate">${ic('folder', 'w-3 h-3 inline -mt-0.5')} ${esc(folderPath(d.folder_id))}</p>` : '';

  const rowHtml = d => `
    <div draggable="${!d.deleted_at}" data-doc="${d.id}" data-act="select" data-id="${d.id}" class="rounded-xl border p-3 cursor-pointer transition ${cls(d)}">
      <div class="flex gap-3">
        <div class="w-10 h-10 rounded-lg overflow-hidden bg-stone-100 text-slate-600 grid place-items-center shrink-0">
          ${A.thumbs[d.id] ? `<img src="${A.thumbs[d.id]}" alt="" loading="lazy" class="w-full h-full object-cover">` : ic(iconFor(d.mime_type), 'w-5 h-5')}</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-2"><p class="font-semibold text-sm truncate">${esc(d.title)}</p>${badge(d.status)}</div>
          <p class="text-xs text-slate-500 truncate">${esc(d.sender_name)}${d.sender_institution ? ' · ' + esc(d.sender_institution) : ''} · ${esc(d.category)} · ${fmtSize(d.file_size)}</p>
          <p class="text-xs text-slate-400 mt-0.5"><span class="font-mono">${esc(d.tracking_code)}</span> · ${fmtDate(d.created_at)}</p>
          ${folderLine(d)}
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-2.5 pl-[3.25rem]">${actions(d)}</div>
    </div>`;

  const tileHtml = d => `
    <div draggable="${!d.deleted_at}" data-doc="${d.id}" data-act="select" data-id="${d.id}" class="rounded-xl border overflow-hidden cursor-pointer transition ${cls(d)}">
      <div class="relative h-28 bg-stone-100 grid place-items-center text-ink overflow-hidden">
        ${A.thumbs[d.id] ? `<img src="${A.thumbs[d.id]}" alt="" loading="lazy" class="w-full h-full object-cover">`
          : `<div class="text-center">${ic(iconFor(d.mime_type), 'w-8 h-8 mx-auto')}<p class="font-display font-extrabold text-sm mt-1">${ALLOWED[d.mime_type] || 'FILE'}</p></div>`}
        <span class="absolute top-1.5 left-1.5">${badge(d.status)}</span>
      </div>
      <div class="p-2.5">
        <p class="font-semibold text-[13px] truncate">${esc(d.title)}</p>
        <p class="text-[11px] text-slate-500 truncate">${esc(d.sender_name)}${d.sender_institution ? ' · ' + esc(d.sender_institution) : ''} · ${fmtSize(d.file_size)}</p>
        <p class="text-[11px] text-slate-400 truncate">${new Date(d.created_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })}</p>
        ${d.deleted_at ? `<p class="text-[11px] text-stamp truncate">Hilang dalam ${daysLeft(d)} hari</p>` : ''}
        <div class="flex flex-wrap gap-1 mt-2">${actions(d)}</div>
      </div>
    </div>`;

  const empty = `<div class="h-full grid place-items-center text-center p-6 text-slate-400">
      <div>${ic(A.view === 'inbox' ? 'inbox' : A.view === 'trash' ? 'trash-2' : 'folder-open', 'w-10 h-10 mx-auto')}
      <p class="mt-2 text-sm font-semibold text-slate-500">${A.search || A.from || A.to ? 'Tidak ada hasil untuk filter ini' : A.view === 'inbox' ? 'Inbox kosong. Semua berkas sudah diproses' : A.view === 'trash' ? 'Sampah kosong' : 'Belum ada berkas di sini'}</p>
      <p class="text-xs mt-1">${A.search || A.from || A.to ? 'Ubah kata kunci atau reset tanggal.' : ''}</p></div></div>`;

  const seg = (m, icon, t) => `<button data-act="mode" data-id="${m}" title="${t}" class="p-1.5 rounded-md ${A.mode === m ? 'bg-white shadow-sm text-ink' : 'text-slate-500 hover:text-ink'}">${ic(icon, 'w-4 h-4')}</button>`;
  $('#list').innerHTML = `
    <div class="px-4 py-3 border-b border-stone-200 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0">
        <button data-act="toggle-side" class="hidden lg:inline-flex p-1.5 -ml-1.5 rounded-lg text-slate-500 hover:bg-stone-100" title="Tampilkan / sembunyikan sidebar">${ic('panel-left', 'w-4 h-4')}</button>
        <h2 class="font-display font-bold text-lg truncate">${viewTitle()}</h2>
        ${A.view.length === 36 && folderById(A.view) ? `<button data-act="rename-folder" data-id="${A.view}" class="p-1.5 rounded-lg text-slate-500 hover:bg-stone-100 shrink-0" title="Ubah nama folder">${ic('pencil', 'w-4 h-4')}</button>` : ''}
      </div>
      <div class="flex items-center gap-2 shrink-0">
        ${A.view === 'trash' && A.trash.length ? `<button data-act="empty-trash" class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-semibold bg-red-50 text-stamp hover:bg-red-100">${ic('trash-2', 'w-3.5 h-3.5')} Kosongkan</button>` : ''}
        <span class="text-xs font-semibold text-slate-500">${l.length}</span>
        <div class="flex rounded-lg bg-stone-100 p-0.5">${seg('list', 'list', 'Tampilan daftar')}${seg('grid', 'layout-grid', 'Tampilan grid')}</div>
      </div>
    </div>
    ${A.view === 'trash' ? `<p class="px-4 py-2 text-xs bg-amber-50 text-amber-800 border-b border-stone-100">${ic('info', 'w-3.5 h-3.5 inline -mt-0.5')} Berkas di Sampah dihapus permanen otomatis setelah ${TRASH_DAYS} hari. Pulihkan sebelum waktunya jika masih dibutuhkan.</p>` : ''}
    <div class="flex-1 overflow-auto scroll-thin p-3 ${grid && l.length ? 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 gap-2.5 content-start' : 'space-y-2'}">
      ${l.length ? l.map(grid ? tileHtml : rowHtml).join('') : empty}
    </div>
    ${l.length && A.view !== 'trash' ? `<p class="hidden lg:block px-4 py-2 text-[11px] text-slate-400 border-t border-stone-100">Klik = pratinjau · Klik 2x = layar penuh · Tarik ke folder = arsipkan</p>` : ''}`;
  icons();
  ensureThumbs(l);
}

async function signedUrl(d, download = false) {
  const key = d.id + (download ? ':dl' : '');
  const c = A.urlCache[key];
  if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await sb.storage.from(d.bucket).createSignedUrl(d.file_path, 3600, download ? { download: d.file_name } : undefined);
  if (error) throw error;
  A.urlCache[key] = { url: data.signedUrl, exp: Date.now() + 3300 * 1000 };
  return data.signedUrl;
}

  const box = $('#preview');
  const d = docById(A.sel);
  if (!d) {
    box.innerHTML = `<div class="flex-1 grid place-items-center text-center p-8 text-slate-400">
      <div>${ic('scan-eye', 'w-12 h-12 mx-auto')}<p class="mt-3 font-display font-bold text-lg text-slate-500">Pilih berkas untuk dilihat</p>
      <p class="text-sm mt-1">Pratinjau PDF dan gambar tampil langsung di sini, tanpa perlu mengunduh.</p></div></div>`;
    return icons();
  }
  box.innerHTML = `
    <div class="px-5 py-3 border-b border-stone-200">
      <button data-act="tab" data-id="list" class="lg:hidden inline-flex items-center gap-1 text-sm font-semibold text-ink mb-2">${ic('arrow-left')} Daftar berkas</button>
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0"><h2 class="font-display font-bold text-lg truncate">${esc(d.title)}</h2>
          <p class="text-xs text-slate-500 truncate">${esc(d.file_name)} · ${fmtSize(d.file_size)}</p></div>
        <div class="flex gap-1.5 shrink-0">
          <button data-act="toggle-list" class="hidden lg:inline-flex p-2 rounded-lg bg-stone-100 hover:bg-stone-200" title="${A.hideList ? 'Tampilkan daftar' : 'Perluas pratinjau'}">${ic(A.hideList ? 'minimize-2' : 'maximize-2')}</button>
          <button data-act="fullscreen" data-id="${d.id}" class="p-2 rounded-lg bg-stone-100 hover:bg-stone-200" title="Buka di tab baru">${ic('external-link')}</button>
          <button data-act="download" data-id="${d.id}" class="p-2 rounded-lg bg-stone-100 hover:bg-stone-200" title="Unduh">${ic('download')}</button>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-3">${actions(d, true)}</div>
    </div>
    <div class="grid sm:grid-cols-2 gap-x-6 gap-y-1 px-5 py-3 text-sm border-b border-stone-100 bg-stone-50/60">
      ${d.deleted_at ? `<p class="sm:col-span-2 text-stamp font-semibold">${ic('trash-2', 'w-4 h-4 inline -mt-0.5')} Ada di Sampah · hilang permanen dalam ${daysLeft(d)} hari</p>` : ''}
      <p><span class="text-slate-500">Pengirim:</span> <b>${esc(d.sender_name)}</b></p>
      <p><span class="text-slate-500">Instansi:</span> ${esc(d.sender_institution) || '–'}</p>
      <p><span class="text-slate-500">Kategori:</span> ${esc(d.category)}</p>
      <p><span class="text-slate-500">Resi:</span> <span class="font-mono">${esc(d.tracking_code)}</span></p>
      <p><span class="text-slate-500">Dikirim:</span> ${fmtDate(d.created_at)}</p>
      <p><span class="text-slate-500">Status:</span> ${badge(d.status)}</p>
      ${d.description ? `<p class="sm:col-span-2"><span class="text-slate-500">Catatan (perihal / tanggal dokumen):</span> ${esc(d.description)}</p>` : ''}
      ${d.folder_id ? `<p class="sm:col-span-2"><span class="text-slate-500">Folder:</span> ${esc(folderPath(d.folder_id))}</p>` : ''}
    </div>
    <div id="pv-body" class="flex-1 min-h-[16rem] bg-stone-100 grid place-items-center overflow-auto">
      <p class="text-sm text-slate-500 flex items-center gap-2">${ic('loader-2', 'w-4 h-4 animate-spin')} Memuat pratinjau…</p></div>`;
  icons();

  try {
    const url = await signedUrl(d);
    if (A.sel !== d.id) return;
    const body = $('#pv-body'); if (!body) return;
    if (d.mime_type === 'application/pdf') {
      body.className = 'flex-1 min-h-[16rem] bg-stone-200';
      body.innerHTML = `<iframe src="${url}" class="w-full h-full min-h-[24rem]" title="Pratinjau PDF"></iframe>`;
    } else if ((d.mime_type || '').startsWith('image/')) {
      body.innerHTML = `<img src="${url}" alt="${esc(d.title)}" class="max-w-full max-h-full object-contain p-4">`;
    } else {
      body.innerHTML = `<div class="text-center p-8"><div class="w-16 h-16 mx-auto rounded-2xl bg-white shadow grid place-items-center text-ink">${ic(iconFor(d.mime_type), 'w-8 h-8')}</div>
        <p class="font-semibold mt-3">Pratinjau langsung tidak tersedia untuk tipe ini</p>
        <p class="text-sm text-slate-500">Unduh file untuk membukanya.</p>
        <button data-act="download" data-id="${d.id}" class="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-ink text-white text-sm font-semibold">${ic('download')} Unduh file</button></div>`;
    }
    icons();
  } catch (e) {
    const body = $('#pv-body'); if (body) body.innerHTML = `<p class="text-sm text-stamp p-6">Gagal memuat pratinjau: ${esc(e.message)}</p>`;
  }
}

function selectDoc(id) { A.sel = id; if (isMobile()) A.tab = 'preview'; renderList(); renderPreview(); renderTabs(); }

/* ---------- operasi data (Supabase) ---------- */
function folderOptions(parent = null, depth = 0, selected = '') {
  return A.folders.filter(f => (f.parent_id || null) === parent).map(f =>
    `<option value="${f.id}" ${f.id === selected ? 'selected' : ''}>${'\u00A0\u00A0'.repeat(depth)}${depth ? '↳ ' : ''}${esc(f.name)}</option>${folderOptions(f.id, depth + 1, selected)}`).join('');
}

  openModal(`
    <h3 class="font-display font-bold text-xl flex items-center gap-2">${ic(isMove ? 'folder-input' : 'check-check', 'w-5 h-5 text-ink')} ${isMove ? 'Pindahkan berkas' : 'Setujui & arsipkan'}</h3>
    <p class="text-sm text-slate-600 mt-1 truncate">${esc(d.title)}</p>
    <label class="block mt-4"><span class="text-sm font-semibold">Simpan ke folder</span>
      <select id="pick-folder" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-ink/30 focus:border-ink" autofocus>
        <option value="">(Tanpa folder)</option>${folderOptions(null, 0, pre)}</select></label>

    <div class="flex justify-end gap-2 mt-6">
      <button data-act="close" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-stone-100">Batal</button>
      <button data-act="do-archive" data-id="${d.id}" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-ink hover:bg-ink-soft">${isMove ? 'Pindahkan' : 'Arsipkan'}</button>
    </div>`);
}

async function archiveDoc(id, folderId) {
  const d = docById(id); if (!d) return;
  try {
    const patch = { status: 'archived', folder_id: folderId || null };
    const oldBucket = d.bucket;
    if (oldBucket !== 'archives') {
      // Pindah lintas bucket: download -> upload ke archives -> update DB -> hapus dari inbox-temp
      const dl = await sb.storage.from(oldBucket).download(d.file_path); if (dl.error) throw dl.error;
      const up = await sb.storage.from('archives').upload(d.file_path, dl.data, { contentType: d.mime_type || undefined, upsert: true }); if (up.error) throw up.error;
      patch.bucket = 'archives'; patch.file_url = `archives/${d.file_path}`;
    }
    const { error } = await sb.from('documents').update(patch).eq('id', id); if (error) throw error;
    if (oldBucket !== 'archives') await sb.storage.from(oldBucket).remove([d.file_path]);
    Object.assign(d, patch); delete A.urlCache[id]; delete A.thumbs[id];
    toast(folderId ? `Diarsipkan ke "${folderById(folderId)?.name}"` : 'Berkas diarsipkan');
    if (folderId) { let f = folderById(folderId); while (f?.parent_id) { A.expanded.add(f.parent_id); f = folderById(f.parent_id); } }
    renderAll();
  } catch (e) { toast(e.message || 'Gagal mengarsipkan', 'error'); }
}

async function setStatus(id, status) {
  const { error } = await sb.from('documents').update({ status }).eq('id', id);
  if (error) return toast(error.message, 'error');
  docById(id).status = status;
  toast(status === 'rejected' ? 'Berkas ditolak' : 'Berkas dikembalikan ke Inbox');
  renderAll();
}

async function deleteDoc(id) {   // pindah ke Sampah (bisa dipulihkan selama TRASH_DAYS hari)
  const d = docById(id); if (!d) return;
  if (!await confirmBox({ title: 'Pindahkan ke Sampah?', text: `"${d.title}" disimpan di Sampah selama ${TRASH_DAYS} hari, lalu dihapus permanen otomatis. Selama itu masih bisa dipulihkan.`, ok: 'Pindahkan ke Sampah', danger: true })) return;
  const deleted_at = new Date().toISOString();
  const { error } = await sb.from('documents').update({ deleted_at }).eq('id', id);
  if (error) return toast(error.message, 'error');
  A.docs = A.docs.filter(x => x.id !== id);
  A.trash.unshift(Object.assign(d, { deleted_at }));
  if (A.sel === id) A.sel = null;
  toast('Berkas dipindahkan ke Sampah'); renderAll();
}

async function untrashDoc(id) {
  const d = docById(id); if (!d) return;
  const { error } = await sb.from('documents').update({ deleted_at: null }).eq('id', id);
  if (error) return toast(error.message, 'error');
  A.trash = A.trash.filter(x => x.id !== id);
  d.deleted_at = null; A.docs.unshift(d); A.docs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  toast('Berkas dipulihkan'); renderAll();
}

// hapus file + baris database secara permanen
async function purgeDocs(list) {
  const byBucket = {};
  list.forEach(d => (byBucket[d.bucket] ||= []).push(d.file_path));
  for (const [b, paths] of Object.entries(byBucket)) {
    const rm = await sb.storage.from(b).remove(paths); if (rm.error) throw rm.error;
  }
  const { error } = await sb.from('documents').delete().in('id', list.map(d => d.id)); if (error) throw error;
  const gone = new Set(list.map(d => d.id));
  A.trash = A.trash.filter(d => !gone.has(d.id));
  if (gone.has(A.sel)) A.sel = null;
}

async function purgeDoc(id) {
  const d = docById(id); if (!d) return;
  if (!await confirmBox({ title: 'Hapus permanen?', text: `"${d.title}" akan dihapus selamanya beserta filenya dan tidak bisa dipulihkan.`, ok: 'Hapus permanen', danger: true })) return;
  try { await purgeDocs([d]); toast('Berkas dihapus permanen'); renderAll(); } catch (e) { toast(e.message, 'error'); }
}

async function emptyTrash() {
  if (!A.trash.length) return;
  if (!await confirmBox({ title: 'Kosongkan Sampah?', text: `${A.trash.length} berkas akan dihapus selamanya dan tidak bisa dipulihkan.`, ok: 'Kosongkan', danger: true })) return;
  try { await purgeDocs([...A.trash]); toast('Sampah dikosongkan'); renderAll(); } catch (e) { toast(e.message, 'error'); }
}

// otomatis: berkas yang sudah > TRASH_DAYS hari di Sampah dihapus permanen (dijalankan saat admin memuat data)
async function purgeExpired() {
  if (A.purging) return 0;
  const limit = Date.now() - TRASH_DAYS * 86400000;
  const old = A.trash.filter(d => new Date(d.deleted_at).getTime() < limit);
  if (!old.length) return 0;
  A.purging = true;
  try { await purgeDocs(old); return old.length; } finally { A.purging = false; }
}

/* ---------- edit dokumen (judul, catatan, kategori) ---------- */
function openEditModal(id) {
  const d = docById(id); if (!d) return;
  const cats = CATEGORIES.includes(d.category) ? CATEGORIES : [d.category, ...CATEGORIES];
  const inp = 'mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ink/30 focus:border-ink';
  openModal(`
    <h3 class="font-display font-bold text-xl flex items-center gap-2">${ic('pencil', 'w-5 h-5 text-ink')} Edit dokumen</h3>
    <label class="block mt-4"><span class="text-sm font-semibold">Judul dokumen</span>
      <input id="ed-title" maxlength="200" value="${esc(d.title)}" autofocus class="${inp}"></label>
    <label class="block mt-4"><span class="text-sm font-semibold">Kategori</span>
      <select id="ed-cat" class="${inp} bg-white">${cats.map(c => `<option ${c === d.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="block mt-4"><span class="text-sm font-semibold">Catatan singkat (Perihal / tanggal dokumen)</span>
      <textarea id="ed-note" rows="4" maxlength="1000" class="${inp}">${esc(d.description || '')}</textarea></label>
    <div class="flex justify-end gap-2 mt-6">
      <button data-act="close" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-stone-100">Batal</button>
      <button id="ed-ok" data-act="save-edit" data-id="${d.id}" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-ink hover:bg-ink-soft">Simpan</button>
    </div>`, 'max-w-lg');
}

async function saveEdit(id) {
  const d = docById(id); if (!d) return;
  const title = $('#ed-title').value.trim(), category = $('#ed-cat').value, description = $('#ed-note').value.trim() || null;
  if (!title) return toast('Judul dokumen wajib diisi.', 'error');
  const { error } = await sb.from('documents').update({ title, category, description }).eq('id', id);
  if (error) return toast(error.message, 'error');
  Object.assign(d, { title, category, description });
  closeModal(); toast('Dokumen diperbarui'); renderAll();
}

/* ---------- ubah nama folder ---------- */
function openRenameFolder(id) {
  const f = folderById(id); if (!f) return;
  openModal(`
    <h3 class="font-display font-bold text-xl flex items-center gap-2">${ic('pencil', 'w-5 h-5 text-ink')} Ubah nama folder</h3>
    <label class="block mt-4"><span class="text-sm font-semibold">Nama folder</span>
      <input id="rf-name" maxlength="100" value="${esc(f.name)}" autofocus class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ink/30 focus:border-ink"></label>
    <div class="flex justify-end gap-2 mt-6">
      <button data-act="close" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-stone-100">Batal</button>
      <button id="rf-ok" data-act="save-folder-name" data-id="${f.id}" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-ink hover:bg-ink-soft">Simpan</button>
    </div>`);
  const i = $('#rf-name'); if (i) i.select();
}

async function saveFolderName(id) {
  const f = folderById(id); if (!f) return;
  const name = $('#rf-name').value.trim(); if (!name) return toast('Nama folder wajib diisi.', 'error');
  const { error } = await sb.from('folders').update({ name }).eq('id', id);
  if (error) return toast(error.message, 'error');
  f.name = name; A.folders.sort((a, b) => a.name.localeCompare(b.name));
  closeModal(); toast('Nama folder diubah'); renderAll();
}

function openFolderModal(parentId = '') {
  openModal(`
    <h3 class="font-display font-bold text-xl flex items-center gap-2">${ic('folder-plus', 'w-5 h-5 text-ink')} Buat folder baru</h3>
    <label class="block mt-4"><span class="text-sm font-semibold">Nama folder</span>
      <input id="nf-name" maxlength="100" placeholder="mis. Dokumen Keluar 2026" autofocus class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ink/30 focus:border-ink"></label>
    <label class="block mt-4"><span class="text-sm font-semibold">Letakkan di dalam</span>
      <select id="nf-parent" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-ink/30 focus:border-ink">
        <option value="">(Folder utama)</option>${folderOptions(null, 0, parentId)}</select></label>
    <div class="flex justify-end gap-2 mt-6">
      <button data-act="close" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-stone-100">Batal</button>
      <button id="nf-ok" data-act="create-folder" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-ink hover:bg-ink-soft">Buat folder</button>
    </div>`);
}

async function createFolder() {
  const name = $('#nf-name').value.trim(); if (!name) return toast('Nama folder wajib diisi.', 'error');
  const parent_id = $('#nf-parent').value || null;
  const { data, error } = await sb.from('folders').insert({ name, parent_id }).select().single();
  if (error) return toast(error.message, 'error');
  A.folders.push(data); A.folders.sort((a, b) => a.name.localeCompare(b.name));
  if (parent_id) A.expanded.add(parent_id);
  closeModal(); toast(`Folder "${name}" dibuat`); renderSide();
}

async function deleteFolder(id) {
  const f = folderById(id); if (!f) return;
  if (!await confirmBox({ title: `Hapus folder "${f.name}"?`, text: 'Semua sub-folder ikut terhapus. Berkas di dalamnya tidak dihapus, hanya menjadi "Tanpa folder".', ok: 'Hapus folder', danger: true })) return;
  const { error } = await sb.from('folders').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  if (descendants(id).includes(A.view)) A.view = 'all';
  await loadAll(true); toast('Folder dihapus');
}

async function openFull(id, download = false) {
  const d = docById(id); if (!d) return;
  try { const url = await signedUrl(d, download); download ? (location.href = url) : window.open(url, '_blank', 'noopener'); }
  catch (e) { toast(e.message, 'error'); }
}

/* =====================================================================
   EVENT — satu pintu untuk semua klik / drag
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'modal-bg': if (e.target === el) closeModal(); break;
    case 'close': closeModal(); break;

    // tema & tata letak
    case 'theme': openThemeModal(); break;
    case 'set-mode': THEME.mode = id; applyTheme(); openThemeModal(); break;
    case 'set-accent': THEME.accent = id; applyTheme(); openThemeModal(); break;
    case 'goto': document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'tab': A.tab = id; renderTabs(); break;
    case 'mode': A.mode = id; renderList(); break;
    case 'toggle-side': A.hideSide = !A.hideSide; renderTabs(); break;
    case 'toggle-list': A.hideList = !A.hideList; renderTabs(); renderPreview(); break;

    // publik
    case 'pick': if (!e.target.closest('input')) $('#file-input').click(); break;
    case 'clear-file': clearFiles(); break;
    case 'remove-file': removeFile(+id); break;
    case 'submit': submitUpload(); break;
    case 'track': trackCode(); break;
    case 'hist-check': $('#track-code').value = id; trackCode(); $('#sec-track').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'hist-clear': if (confirm('Hapus semua riwayat di perangkat ini? Kode resi tidak bisa dicari ulang.')) { histSave([]); histRender(); toast('Riwayat dihapus', 'info'); } break;
    case 'copy-code': try { await navigator.clipboard.writeText(id); toast('Kode resi disalin'); } catch { toast('Salin manual: ' + id, 'info'); } break;
    case 'again': closeModal(); renderPublic(); break;
    case 'copy-all': { const t = P.codes.map(r => `${r.name} — ${r.code}`).join('\n'); try { await navigator.clipboard.writeText(t); toast('Semua kode resi disalin'); } catch { toast('Salin manual:\n' + t, 'info'); } break; }

    // auth
    case 'login': doLogin(); break;
    case 'logout': await sb.auth.signOut(); A.mounted = false; if (A.channel) sb.removeChannel(A.channel); route(); break;
    case 'refresh': await loadAll(true); toast('Data dimuat ulang', 'info'); break;

    // navigasi admin
    case 'view': A.view = id; A.sel = null; if (isMobile()) A.tab = 'list'; { let f = folderById(id); while (f?.parent_id) { A.expanded.add(f.parent_id); f = folderById(f.parent_id); } } renderSide(); renderList(); renderPreview(); renderTabs(); break;
    case 'toggle': A.expanded.has(id) ? A.expanded.delete(id) : A.expanded.add(id); renderSide(); e.stopPropagation(); break;
    case 'select': case 'preview': selectDoc(id); break;
    case 'clear-dates': A.from = A.to = ''; $('#df').value = $('#dt').value = ''; renderList(); break;

    // aksi dokumen
    case 'approve': openFolderPicker(id, 'approve'); break;
    case 'move':    openFolderPicker(id, 'move'); break;
    case 'do-archive': { const fid = $('#pick-folder').value; closeModal(); archiveDoc(id, fid); break; }
    case 'reject':  if (await confirmBox({ title: 'Tolak berkas ini?', text: 'Berkas dipindah ke daftar "Ditolak" dan bisa dikembalikan atau dihapus kapan saja.', ok: 'Tolak berkas', danger: true })) setStatus(id, 'rejected'); break;
    case 'restore': setStatus(id, 'pending'); break;
    case 'delete':  deleteDoc(id); break;
    case 'untrash': untrashDoc(id); break;
    case 'purge':   purgeDoc(id); break;
    case 'empty-trash': emptyTrash(); break;
    case 'edit':    openEditModal(id); break;
    case 'save-edit': saveEdit(id); break;
    case 'fullscreen': openFull(id); break;
    case 'download': openFull(id, true); break;

    // folder
    case 'new-folder': openFolderModal(id || ((A.view.length === 36) ? A.view : '')); break;
    case 'create-folder': createFolder(); break;
    case 'del-folder': deleteFolder(id); break;
    case 'rename-folder': openRenameFolder(id); break;
    case 'save-folder-name': saveFolderName(id); break;
  }
});

document.addEventListener('dblclick', e => {
  const r = e.target.closest('[data-doc]'); if (r && !e.target.closest('button')) openFull(r.dataset.doc);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'pw' || e.target.id === 'em') doLogin();
  else if (e.target.id === 'nf-name') createFolder();
  else if (e.target.id === 'rf-name') saveFolderName($('#rf-ok').dataset.id);
  else if (e.target.id === 'ed-title') saveEdit($('#ed-ok').dataset.id);
  else if (e.target.id === 'track-code') trackCode();
});

document.addEventListener('input', e => {
  if (e.target.id === 'q')  { A.search = e.target.value; renderList(); }
  if (e.target.id === 'df') { A.from = e.target.value; renderList(); }
  if (e.target.id === 'dt') { A.to = e.target.value; renderList(); }
});

document.addEventListener('change', e => { if (e.target.id === 'file-input' && e.target.files.length) { addFiles(e.target.files); e.target.value = ''; } });

// drag & drop: upload publik + tarik berkas ke folder
window.addEventListener('dragover', e => {
  e.preventDefault();
  const dz = e.target.closest?.('#dz'); if (dz) dz.classList.add('dz-active');
  document.querySelectorAll('.drop-hi').forEach(x => x.classList.remove('drop-hi'));
  const fd = e.target.closest?.('[data-drop]'); if (fd && A.dragId) fd.classList.add('drop-hi');
});
window.addEventListener('dragleave', e => { e.target.closest?.('#dz')?.classList.remove('dz-active'); e.target.closest?.('[data-drop]')?.classList.remove('drop-hi'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  document.querySelectorAll('.dz-active,.drop-hi').forEach(x => x.classList.remove('dz-active', 'drop-hi'));
  if (A.dragId) {
    const fd = e.target.closest?.('[data-drop]');
    if (fd) archiveDoc(A.dragId, fd.dataset.drop);
    A.dragId = null; return;
  }
  if (e.target.closest?.('#dz') && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
document.addEventListener('dragstart', e => {
  const r = e.target.closest?.('[data-doc]'); if (!r) return;
  A.dragId = r.dataset.doc; e.dataTransfer.setData('text/plain', A.dragId); e.dataTransfer.effectAllowed = 'move';
  r.style.opacity = '.5';
});
document.addEventListener('dragend', e => { A.dragId = null; const r = e.target.closest?.('[data-doc]'); if (r) r.style.opacity = ''; });

/* =====================================================================
   ROUTER — #/ = publik, #/admin = dashboard
   ===================================================================== */
function renderSetup() {
  app.innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-lg bg-white rounded-2xl border border-stone-200 p-7">
    <div class="w-11 h-11 rounded-xl bg-amber-100 text-amber-700 grid place-items-center">${ic('settings-2', 'w-5 h-5')}</div>
    <h1 class="font-display font-extrabold text-2xl mt-4">Hubungkan ke Supabase</h1>
    <p class="text-sm text-slate-600 mt-2">Buka file <b>index.html</b> dengan editor teks, lalu isi <code class="bg-stone-100 px-1 rounded">SUPABASE_URL</code> dan <code class="bg-stone-100 px-1 rounded">SUPABASE_ANON_KEY</code> di bagian <b>CFG</b> (paling atas script). Nilainya ada di Supabase Dashboard, menu Project Settings, lalu API.</p>
  </div></div>`;
  icons();
}

async function route() {
  closeModal();
  if (!configured) return renderSetup();
  if (location.hash.startsWith('#/admin')) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { A.mounted = false; return renderLogin(); }
    A.user = session.user; return mountAdmin();
  }
  if (A.channel) { sb.removeChannel(A.channel); A.channel = null; }
  A.mounted = false;
  renderPublic();
}
window.addEventListener('hashchange', route);
if (configured) sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && location.hash.startsWith('#/admin') && A.mounted) route(); });
route();
</script>
